# TEMPLATE ONLY — replace every REPLACE_ME value before a real cluster apply.
# Never commit real passwords, tokens, or connection strings.
#
# Recommended generation:
#   openssl rand -base64 24   # POSTGRES_PASSWORD
#   openssl rand -base64 32   # SESSION_SECRET / TOTP / SECRETS keys
#
# Prefer Sealed Secrets, External Secrets Operator, or your cloud secret
# manager instead of applying this file with live values from Git.
#
# For an external PostgreSQL: set DATABASE_URL to that DSN and do not apply
# postgres.yaml (see README "External database").
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  # Must match POSTGRES_USER / POSTGRES_DB / POSTGRES_PASSWORD and the postgres Service DNS.
  DATABASE_URL: "postgres://sentinel:REPLACE_ME@postgres:5432/sentinel?sslmode=disable"
  SESSION_SECRET: "REPLACE_ME"
  TOTP_ENCRYPTION_KEY: "REPLACE_ME"
  SECRETS_ENCRYPTION_KEY: "REPLACE_ME"
  # Optional one-time bootstrap (omit or leave empty after first admin exists).
  SENTINEL_BOOTSTRAP_ADMIN_EMAIL: ""
  SENTINEL_BOOTSTRAP_ADMIN_PASSWORD: ""
