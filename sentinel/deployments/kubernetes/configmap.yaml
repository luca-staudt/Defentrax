apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/component: config
data:
  APP_ENV: "production"
  API_PORT: "8080"
  LOG_LEVEL: "info"
  SESSION_COOKIE_NAME: "sentinel_session"
  SESSION_TTL_HOURS: "24"
  # Behind TLS Ingress: set COOKIE_SECURE=true (override via Secret or patch).
  COOKIE_SECURE: "true"
  # Adjust to your Ingress host(s). Comma-separated.
  CORS_ALLOWED_ORIGINS: "https://sentinel.example.com"
  # In-cluster Redis (no auth). Prefer Secret if you enable Redis AUTH.
  REDIS_URL: "redis://redis:6379/0"
  SENTINEL_RULES_PATH: "/opt/sentinel/rules"
  SENTINEL_PLUGIN_DIR: "/opt/sentinel/plugins/examples"
  # Empty allowlist = no plugins loaded (secure default).
  SENTINEL_PLUGIN_ALLOWLIST: ""
  ALERT_DEDUP_COOLDOWN_SEC: "900"
  LOGIN_RATE_LIMIT_MAX: "10"
  LOGIN_RATE_LIMIT_WINDOW_SEC: "60"
  INGEST_RATE_LIMIT_MAX: "120"
  INGEST_RATE_LIMIT_WINDOW_SEC: "60"
  # Frontend → API (in-cluster DNS)
  API_PROXY_TARGET: "http://api:8080"
  API_INTERNAL_URL: "http://api:8080"
  # Browser WebSocket URL must reach the API from the client (Ingress host).
  # Rebuild the frontend image if you change NEXT_PUBLIC_* build args; this
  # runtime value is used where the standalone server reads it.
  NEXT_PUBLIC_WS_URL: "wss://sentinel.example.com"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  # Postgres identity (password lives in Secret only)
  POSTGRES_USER: "sentinel"
  POSTGRES_DB: "sentinel"
