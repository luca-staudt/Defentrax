# Requires an Ingress controller (e.g. ingress-nginx on kind/minikube).
# Adjust host, TLS secret, and annotations for your environment.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: ingress
  annotations:
    # Example for ingress-nginx — remove/replace for other controllers.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket upgrades for live alerts (path depends on your Ingress rules).
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - sentinel.example.com
  #     secretName: sentinel-tls
  rules:
    - host: sentinel.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
