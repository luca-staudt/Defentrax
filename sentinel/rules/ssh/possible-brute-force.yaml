id: ssh.possible-brute-force
name: Possible SSH brute-force pattern
description: Multiple failed SSH authentication attempts from the same source within a short time window may indicate credential guessing.
severity: high
version: 1
condition:
  source: authlog
  category: auth
  fields:
    result: failed
    program: sshd
threshold:
  count: 5
  window_seconds: 300
group_by:
  - src_ip
action:
  title: Possible SSH brute-force from {{src_ip}}
  description: Five or more failed SSH login attempts from {{src_ip}} on {{host}} within five minutes. This may indicate automated credential guessing; review auth logs and consider blocking or rate limiting the source.
