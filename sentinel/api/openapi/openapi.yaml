openapi: 3.0.3
info:
  title: Sentinel API
  description: |
    Control-plane REST API for Sentinel (security monitoring / lightweight SIEM).

    This specification documents **implemented** routes only (inventory from
    `sentinel/api/internal/server/server.go`). It does **not** invent endpoints.

    **Not exposed as REST (yet):**
    - No `GET /api/v1/audit` — audit rows are written server-side; there is no list API.
    - No standalone `GET /api/v1/agents` — agents appear nested under `GET /api/v1/servers/{id}`.
    - No `/api/v1/metrics` — use `GET /api/v1/dashboard/stats`.

    Interactive UI: `GET /api/v1/docs` (Swagger UI). Raw spec: `GET /api/v1/openapi.yaml`.
  version: 0.1.0
  contact:
    name: Sentinel
servers:
  - url: http://localhost:8080
    description: Local default (API_PORT / PORT)
tags:
  - name: Health
    description: "Process liveness and readiness (outside `/api/v1` prefix)"
  - name: Meta
    description: Version and OpenAPI artifacts
  - name: Auth
    description: Sessions, TOTP 2FA, recovery codes
  - name: Users
    description: User admin and personal API keys
  - name: Servers
    description: Managed hosts and enrollment tokens
  - name: Agents
    description: Agent enrollment, heartbeat, and event ingest
  - name: Events
    description: Persisted security events
  - name: Alerts
    description: Alert lifecycle and realtime feed
  - name: Rules
    description: Detection rules (enable/disable)
  - name: Notifications
    description: Notification channels and rules
  - name: Dashboard
    description: Aggregated operator metrics
  - name: Plugins
    description: Plugin registry and configs
  - name: Audit
    description: Audit is write-side only today (no list endpoint)

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness probe
      description: "When `DATABASE_URL` is set, pings PostgreSQL."
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /api/v1:
    get:
      tags: [Meta]
      operationId: getAPIVersion
      summary: API version metadata
      security: []
      responses:
        "200":
          description: Version payload
          content:
            application/json:
              schema:
                type: object
                required: [service, version, api]
                properties:
                  service:
                    type: string
                    example: sentinel-api
                  version:
                    type: string
                    example: "0.1.0"
                  api:
                    type: string
                    example: v1

  /api/v1/openapi.yaml:
    get:
      tags: [Meta]
      operationId: getOpenAPISpec
      summary: OpenAPI 3 YAML document
      security: []
      responses:
        "200":
          description: OpenAPI specification
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/docs:
    get:
      tags: [Meta]
      operationId: getSwaggerUI
      summary: Swagger UI for this specification
      security: []
      responses:
        "200":
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Password login
      description: |
        On success without 2FA, sets the session cookie and returns the user.
        When TOTP is enabled, returns `requires_totp` + `login_challenge` (no session yet).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Logged in or TOTP challenge required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/verify:
    post:
      tags: [Auth]
      operationId: authTotpVerify
      summary: Complete login with TOTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_challenge, code]
              properties:
                login_challenge:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/recovery/verify:
    post:
      tags: [Auth]
      operationId: authRecoveryVerify
      summary: Complete login with a recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_challenge, recovery_code]
              properties:
                login_challenge:
                  type: string
                recovery_code:
                  type: string
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: End current session
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      summary: Current authenticated user
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: Principal + roles + permission keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/enroll:
    post:
      tags: [Auth]
      operationId: authTotpEnroll
      summary: Start TOTP enrollment
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: Provisioning material (shown once)
          content:
            application/json:
              schema:
                type: object
                required: [provisioning_uri, secret, recovery_codes]
                properties:
                  provisioning_uri:
                    type: string
                  secret:
                    type: string
                  recovery_codes:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/confirm:
    post:
      tags: [Auth]
      operationId: authTotpConfirm
      summary: Confirm TOTP enrollment
      security:
        - SessionCookie: []
        - BearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "204":
          description: TOTP enabled
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/disable:
    post:
      tags: [Auth]
      operationId: authTotpDisable
      summary: Disable TOTP (password + code)
      security:
        - SessionCookie: []
        - BearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password:
                  type: string
                  format: password
                code:
                  type: string
      responses:
        "204":
          description: TOTP disabled
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      description: "Requires permission `users:read`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserPublic"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create user
      description: "Requires permission `users:write`. Password minimum 12 characters. Default role `VIEWER` if omitted."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                display_name:
                  type: string
                roles:
                  type: array
                  items:
                    $ref: "#/components/schemas/RoleName"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/users/{id}/roles:
    put:
      tags: [Users]
      operationId: updateUserRoles
      summary: Replace user roles
      description: "Requires permission `users:write`. Audited as `user.role_changed`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/RoleName"
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/users/me/api-keys:
    get:
      tags: [Users]
      operationId: listMyAPIKeys
      summary: List own API keys
      description: "Requires permission `api_keys:write`. Never returns full key material."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: Keys (prefix only)
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
    post:
      tags: [Users]
      operationId: createMyAPIKey
      summary: Create API key
      description: |
        Requires permission `api_keys:write`.
        Response includes the full `sent_…` key **once**.
      security:
        - SessionCookie: []
        - BearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created (includes full key once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreated"

  /api/v1/users/me/api-keys/{id}:
    delete:
      tags: [Users]
      operationId: revokeMyAPIKey
      summary: Revoke own API key
      description: "Requires permission `api_keys:write`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/servers:
    get:
      tags: [Servers]
      operationId: listServers
      summary: List servers
      description: "Requires permission `servers:write`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: Server list
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Server"
    post:
      tags: [Servers]
      operationId: createServer
      summary: Create server
      description: "Requires permission `servers:write`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                hostname:
                  type: string
                description:
                  type: string
                environment:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"

  /api/v1/servers/{id}:
    get:
      tags: [Servers, Agents]
      operationId: getServer
      summary: Get server with nested agents
      description: |
        Requires permission `servers:write`.
        Agents are returned nested here; there is no standalone agents list endpoint.
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "200":
          description: Server detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerDetail"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/servers/{id}/enrollment-tokens:
    post:
      tags: [Servers, Agents]
      operationId: createEnrollmentToken
      summary: Create one-time enrollment token
      description: |
        Requires permission `servers:write`.
        Returns a one-time `senr_…` token (shown once). Default TTL 60 minutes (max 24h).
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                ttl_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  default: 60
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentToken"

  /api/v1/agent/enroll:
    post:
      tags: [Agents]
      operationId: agentEnroll
      summary: Enroll agent with enrollment token
      description: "Consumes a `senr_…` token; returns one-time `sagt_…` agent bearer."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_token]
              properties:
                enrollment_token:
                  type: string
                name:
                  type: string
                hostname:
                  type: string
                agent_version:
                  type: string
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, server_id, agent_token, token_prefix]
                properties:
                  agent_id:
                    type: string
                    format: uuid
                  server_id:
                    type: string
                    format: uuid
                  agent_token:
                    type: string
                    description: "One-time `sagt_…` bearer"
                  token_prefix:
                    type: string
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/agent/heartbeat:
    post:
      tags: [Agents]
      operationId: agentHeartbeat
      summary: Agent heartbeat
      security:
        - BearerAgentToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_version:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  agent_id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/agent/events:
    post:
      tags: [Agents, Events]
      operationId: agentIngestEvents
      summary: Batch ingest events
      description: |
        Agent bearer required. Partial success — invalid rows appear in `rejected`.
        Default max batch size 100 (configurable). Rate limited per agent.
      security:
        - BearerAgentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/CanonicalEvent"
      responses:
        "202":
          description: Accepted (may include rejections/duplicates)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventsResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events
      description: "Requires permission `events:read`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: server_id
          in: query
          schema:
            type: string
            format: uuid
        - name: severity
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Message search
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated events
          content:
            application/json:
              schema:
                type: object
                required: [events, total, limit, offset]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /api/v1/events/{id}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get event by id
      description: "Requires permission `events:read`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: List alerts
      description: "Requires permission `alerts:read`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AlertStatus"
        - name: severity
          in: query
          schema:
            type: string
        - name: server_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated alerts
          content:
            application/json:
              schema:
                type: object
                required: [alerts, total, limit, offset]
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /api/v1/alerts/recent-events:
    get:
      tags: [Alerts]
      operationId: listRecentAlertEvents
      summary: Recent in-memory alert feed buffer
      description: "Requires permission `alerts:read`. Returns hub buffer (empty if hub unset)."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: Recent realtime alert events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/RealtimeAlertEvent"

  /api/v1/alerts/{id}:
    get:
      tags: [Alerts]
      operationId: getAlert
      summary: Get alert with timeline
      description: "Requires permission `alerts:read`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "200":
          description: Alert + timeline
          content:
            application/json:
              schema:
                type: object
                required: [alert, timeline]
                properties:
                  alert:
                    $ref: "#/components/schemas/Alert"
                  timeline:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlertTimelineEntry"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Alerts]
      operationId: patchAlert
      summary: Update alert lifecycle
      description: |
        Requires permission `alerts:write`.
        Status transitions: `OPEN` → `ACKNOWLEDGED` → `INVESTIGATING` → `RESOLVED`.
        Audited on status/assignment changes.
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/AlertStatus"
                assigned_to:
                  type: string
                  format: uuid
                  nullable: true
                resolution_notes:
                  type: string
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/ws/alerts:
    get:
      tags: [Alerts]
      operationId: wsAlerts
      summary: WebSocket alert feed
      description: |
        Requires permission `alerts:read` (session or API key).
        Upgrades to WebSocket; text frames are JSON `{ "type": "alert", "data": … }`.
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "101":
          description: Switching Protocols
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/rules:
    get:
      tags: [Rules]
      operationId: listRules
      summary: List detection rules
      description: "Requires permission `rules:read`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/Rule"

  /api/v1/rules/{id}:
    get:
      tags: [Rules]
      operationId: getRule
      summary: Get detection rule
      description: "Requires permission `rules:read`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Rules]
      operationId: patchRule
      summary: Enable or disable a rule
      description: "Requires permission `rules:write`. Body must include `enabled`."
