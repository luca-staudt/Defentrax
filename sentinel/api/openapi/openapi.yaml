openapi: 3.0.3
info:
  title: Defentrax API
  description: |
    Control-plane REST API for Defentrax (security monitoring / lightweight SIEM).

    This specification documents **implemented** routes only (inventory from
    `sentinel/api/internal/server/server.go`). It does **not** invent endpoints.

    **Not exposed as REST (yet):**
    - No standalone `GET /api/v1/agents` — agents appear nested under `GET /api/v1/servers/{id}`.
    - No `/api/v1/metrics` — use `GET /api/v1/dashboard/stats`.

    **Page permissions:** panel routes require a `pages:*` key in addition to the
    data permission named on each operation. `pages:dashboard`, `pages:alerts`,
    `pages:alert_detail`, `pages:events`, `pages:servers`, `pages:server_detail`,
    `pages:rules`, `pages:notifications`, `pages:team`, `pages:roles`, `pages:audit`.
    `SUPER_ADMIN` and `ADMIN` bypass these checks. Plugins and API keys have no page key.

    Interactive UI: `GET /api/v1/docs` (Swagger UI). Raw spec: `GET /api/v1/openapi.yaml`.
  version: 0.3.0
  contact:
    name: Defentrax
servers:
  - url: http://localhost:8080
    description: Local default (API_PORT / PORT)
tags:
  - name: Health
    description: "Process liveness and readiness (outside `/api/v1` prefix)"
  - name: Meta
    description: Version and OpenAPI artifacts
  - name: Auth
    description: Sessions, TOTP 2FA, recovery codes
  - name: Users
    description: User admin and personal API keys
  - name: Servers
    description: Managed hosts and enrollment tokens
  - name: Agents
    description: Agent enrollment, heartbeat, and event ingest
  - name: Events
    description: Persisted security events
  - name: Alerts
    description: Alert lifecycle and realtime feed
  - name: Rules
    description: Detection rules (enable/disable)
  - name: Notifications
    description: Notification channels and rules
  - name: Dashboard
    description: Aggregated operator metrics
  - name: Plugins
    description: Plugin registry and configs
  - name: Audit
    description: Audit log list/detail (`audit_logs:read`)
  - name: Roles
    description: Role and permission management (`roles:read` / `roles:write`)

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness probe
      description: "When `DATABASE_URL` is set, pings PostgreSQL."
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /api/v1:
    get:
      tags: [Meta]
      operationId: getAPIVersion
      summary: API version metadata
      security: []
      responses:
        "200":
          description: Version payload
          content:
            application/json:
              schema:
                type: object
                required: [service, version, api]
                properties:
                  service:
                    type: string
                    example: sentinel-api
                  version:
                    type: string
                    example: "0.3.0"
                  api:
                    type: string
                    example: v1

  /api/v1/openapi.yaml:
    get:
      tags: [Meta]
      operationId: getOpenAPISpec
      summary: OpenAPI 3 YAML document
      security: []
      responses:
        "200":
          description: OpenAPI specification
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/docs:
    get:
      tags: [Meta]
      operationId: getSwaggerUI
      summary: Swagger UI for this specification
      security: []
      responses:
        "200":
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Password login
      description: |
        On success without 2FA, sets the session cookie and returns the user.
        When TOTP is enabled, returns `requires_totp` + `login_challenge` (no session yet).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Logged in or TOTP challenge required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/verify:
    post:
      tags: [Auth]
      operationId: authTotpVerify
      summary: Complete login with TOTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_challenge, code]
              properties:
                login_challenge:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/recovery/verify:
    post:
      tags: [Auth]
      operationId: authRecoveryVerify
      summary: Complete login with a recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_challenge, recovery_code]
              properties:
                login_challenge:
                  type: string
                recovery_code:
                  type: string
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: End current session
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      summary: Current authenticated user
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: Principal + roles + permission keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/enroll:
    post:
      tags: [Auth]
      operationId: authTotpEnroll
      summary: Start TOTP enrollment
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: Provisioning material (shown once)
          content:
            application/json:
              schema:
                type: object
                required: [provisioning_uri, secret, recovery_codes]
                properties:
                  provisioning_uri:
                    type: string
                  secret:
                    type: string
                  recovery_codes:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/confirm:
    post:
      tags: [Auth]
      operationId: authTotpConfirm
      summary: Confirm TOTP enrollment
      security:
        - SessionCookie: []
        - BearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "204":
          description: TOTP enabled
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/disable:
    post:
      tags: [Auth]
      operationId: authTotpDisable
      summary: Disable TOTP (password + code)
      security:
        - SessionCookie: []
        - BearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password:
                  type: string
                  format: password
                code:
                  type: string
      responses:
        "204":
          description: TOTP disabled
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      description: "Requires `users:read` and `pages:team`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserPublic"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create user
      description: "Requires `users:write` and `pages:team`. Password minimum 12 characters. Default role `VIEWER` if omitted."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                display_name:
                  type: string
                roles:
                  type: array
                  items:
                    $ref: "#/components/schemas/RoleName"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/users/{id}/roles:
    put:
      tags: [Users]
      operationId: updateUserRoles
      summary: Replace user roles
      description: "Requires `users:write` and `pages:team`. Audited as `user.role_changed`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/RoleName"
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get user by id
      description: "Requires `users:read` and `pages:team`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Users]
      operationId: patchUser
      summary: Update user profile or active status
      description: |
        Requires `users:write` and `pages:team`.
        Audited as `user.updated`, `user.disabled`, or `user.enabled`.
        Disabling a user revokes their sessions. Cannot disable yourself.
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                is_active:
                  type: boolean
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/users/{id}/password:
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Admin password reset
      description: "Requires `users:write` and `pages:team`. Revokes all sessions. Audited as `user.password_reset`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 12
      responses:
        "204":
          description: Password reset
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/users/{id}/totp/reset:
    post:
      tags: [Users]
      operationId: resetUserTOTP
      summary: Admin 2FA reset
      description: "Requires `users:write` and `pages:team`. Clears TOTP enrollment. Audited as `auth.totp_admin_reset`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "204":
          description: TOTP cleared
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/users/{id}/sessions:
    get:
      tags: [Users]
      operationId: listUserSessions
      summary: List active sessions for a user
      description: "Requires `users:write` and `pages:team`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSession"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Users]
      operationId: revokeAllUserSessions
      summary: Revoke all sessions for a user
      description: "Requires `users:write` and `pages:team`. Audited as `user.sessions_revoked`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/users/{id}/sessions/{sessionId}:
    delete:
      tags: [Users]
      operationId: revokeUserSession
      summary: Revoke one session
      description: "Requires `users:write` and `pages:team`. Audited as `user.session_revoked`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List roles
      description: "Requires `roles:read` and `pages:roles`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: Roles with permission keys
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
    post:
      tags: [Roles]
      operationId: createRole
      summary: Create custom role
      description: "Requires `roles:write` and `pages:roles`. Audited as `role.created`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
                  description: "`resource:action` keys"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/roles/{id}:
    get:
      tags: [Roles]
      operationId: getRole
      summary: Get role
      description: "Requires `roles:read` and `pages:roles`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Roles]
      operationId: patchRole
      summary: Update role name/description
      description: "Requires `roles:write` and `pages:roles`. System roles cannot be renamed. Audited as `role.updated`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Roles]
      operationId: deleteRole
      summary: Delete custom role
      description: "Requires `roles:write` and `pages:roles`. System roles and roles still assigned to users cannot be deleted. Audited as `role.deleted`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/roles/{id}/permissions:
    put:
      tags: [Roles]
      operationId: setRolePermissions
      summary: Replace role permission set
      description: "Requires `roles:write` and `pages:roles`. Audited as `role.permissions_changed`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/permissions:
    get:
      tags: [Roles]
      operationId: listPermissions
      summary: List permission catalog
      description: "Requires `roles:read` and `pages:roles`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Permission"

  /api/v1/users/me/api-keys:
    get:
      tags: [Users]
      operationId: listMyAPIKeys
      summary: List own API keys
      description: "Requires permission `api_keys:write`. Never returns full key material."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: Keys (prefix only)
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
    post:
      tags: [Users]
      operationId: createMyAPIKey
      summary: Create API key
      description: |
        Requires permission `api_keys:write`.
        Response includes the full `sent_…` key **once**.
      security:
        - SessionCookie: []
        - BearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created (includes full key once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreated"

  /api/v1/users/me/api-keys/{id}:
    delete:
      tags: [Users]
      operationId: revokeMyAPIKey
      summary: Revoke own API key
      description: "Requires permission `api_keys:write`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/servers:
    get:
      tags: [Servers]
      operationId: listServers
      summary: List servers
      description: "Requires `servers:read` and `pages:servers`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      responses:
        "200":
          description: Server list
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Server"
    post:
      tags: [Servers]
      operationId: createServer
      summary: Create server
      description: "Requires `servers:write` and `pages:servers`."
      security:
        - SessionCookie: []
        - BearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                hostname:
                  type: string
                description:
                  type: string
                environment:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"

  /api/v1/servers/{id}:
    get:
      tags: [Servers, Agents]
      operationId: getServer
      summary: Get server with nested agents
      description: |
        Requires `servers:read` and `pages:server_detail`.
        Agents are returned nested here; there is no standalone agents list endpoint.
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      responses:
        "200":
          description: Server detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerDetail"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/servers/{id}/enrollment-tokens:
    post:
      tags: [Servers, Agents]
      operationId: createEnrollmentToken
      summary: Create one-time enrollment token
      description: |
        Requires `servers:write` and `pages:server_detail`.
        Returns a one-time `senr_…` token (shown once). Default TTL 60 minutes (max 24h).
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - $ref: "#/components/parameters/PathUUID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                ttl_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  default: 60
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentToken"

  /api/v1/agent/enroll:
    post:
      tags: [Agents]
      operationId: agentEnroll
      summary: Enroll agent with enrollment token
