  /api/v1/audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: List audit logs
      description: |
        Requires `audit_logs:read` and `pages:audit`. ADMIN and SECURITY_ANALYST have both by default. SUPER_ADMIN and ADMIN bypass the check.
        Newest first. Filters: `action`, `user` (actor email substring), `actor_user_id`,
        `q` (action/entity/email search), `since`/`until` (RFC3339), `limit`/`offset`.
      security:
        - SessionCookie: []
        - BearerApiKey: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
          description: Exact action match (e.g. auth.login)
        - name: user
          in: query
          schema:
            type: string
          description: Actor email substring (ILIKE)
        - name: actor_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
          description: Search action, entity_type, or actor email
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated audit logs
          content:
            application/json:
              schema:
                type: object
                required: [audit_logs, total, limit, offset]
                properties:
                  audit_logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"

