components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sentinel_session
      description: "Server-side session cookie (name configurable via `SESSION_COOKIE_NAME`; default `sentinel_session`)."
    BearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: sent_
      description: "Personal API key (`Authorization: Bearer sent_…`)."
    BearerAgentToken:
      type: http
      scheme: bearer
      bearerFormat: sagt_
      description: "Agent token from enrollment (`Authorization: Bearer sagt_…`)."

  parameters:
    PathUUID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: unauthorized
        message:
          type: string
        request_id:
          type: string

    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string

    RoleName:
      type: string
      enum: [ADMIN, SECURITY_ANALYST, OPERATOR, VIEWER]

    UserPublic:
      type: object
      required: [id, email, display_name, is_active]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        is_active:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleName"

    MeResponse:
      type: object
      required: [id, email, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        is_active:
          type: boolean
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
          description: "Permission keys such as `alerts:read`"

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserPublic"
        requires_totp:
          type: boolean
        login_challenge:
          type: string
          description: "Present when `requires_totp` is true"

    APIKey:
      type: object
      required: [id, name, key_prefix, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
        created_at:
          type: string
          format: date-time

    APIKeyCreated:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          properties:
            key:
              type: string
              description: "Full `sent_…` key (create response only)"

    Server:
      type: object
      required: [id, name, hostname, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hostname:
          type: string
        created_at:
          type: string
          format: date-time

    Agent:
      type: object
      required: [id, server_id, name, status, agent_version]
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        agent_version:
          type: string
        last_heartbeat_at:
          type: string
          format: date-time

    ServerDetail:
      allOf:
        - $ref: "#/components/schemas/Server"
        - type: object
          properties:
            description:
              type: string
            environment:
              type: string
            agents:
              type: array
              items:
                $ref: "#/components/schemas/Agent"

    EnrollmentToken:
      type: object
      required: [id, server_id, token_prefix, expires_at]
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        token_prefix:
          type: string
        token:
          type: string
          description: "Full `senr_…` token (create response only)"
        expires_at:
          type: string
          format: date-time

    CanonicalEvent:
      type: object
      required: [ingest_id, occurred_at, source, message]
      properties:
        ingest_id:
          type: string
          maxLength: 128
          description: "Idempotency key (alphanumeric / `.` `_` `-`)"
        occurred_at:
          type: string
          format: date-time
        source:
          type: string
          maxLength: 64
          example: authlog
        category:
          type: string
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        host:
          type: string
        message:
          type: string
          maxLength: 8192
        raw:
          description: Optional JSON payload
        fields:
          type: object
          additionalProperties: true
        fingerprint:
          type: string

    RejectedEvent:
      type: object
      properties:
        index:
          type: integer
        code:
          type: string
        message:
          type: string

    IngestEventsResponse:
      type: object
      required: [accepted, duplicates]
      properties:
        accepted:
          type: integer
        duplicates:
          type: integer
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/RejectedEvent"

    Event:
      type: object
      required: [id, agent_id, server_id, received_at, occurred_at, source, category, severity, host, message, ingest_id]
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        received_at:
          type: string
          format: date-time
        occurred_at:
          type: string
          format: date-time
        source:
          type: string
        category:
          type: string
        severity:
          type: string
        host:
          type: string
        message:
          type: string
        ingest_id:
          type: string

    AlertStatus:
      type: string
      enum: [OPEN, ACKNOWLEDGED, INVESTIGATING, RESOLVED]

    Alert:
      type: object
      required: [id, server_id, title, description, status, severity, event_count, first_seen_at, last_seen_at, opened_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        rule_id:
          type: string
          format: uuid
        assigned_to:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/AlertStatus"
        severity:
          type: string
        source_ip:
          type: string
        event_count:
          type: integer
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        resolution_notes:
          type: string
        opened_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
        investigating_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlertTimelineEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        message:
          type: string
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        metadata: {}
        created_at:
          type: string
          format: date-time

    RealtimeAlertEvent:
      type: object
      properties:
        type:
          type: string
        alert_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        status:
          type: string
        severity:
          type: string
        title:
          type: string
        event_count:
          type: integer
        at:
          type: string
          format: date-time

    Rule:
      type: object
      required: [id, rule_id, name, enabled, severity, version, definition, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        rule_id:
          type: string
          description: Stable YAML rule id
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        severity:
          type: string
        version:
          type: integer
        definition:
          description: Rule definition JSON
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationChannel:
      type: object
      required: [id, name, channel_type, config, has_secrets, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        channel_type:
          type: string
          enum: [discord, slack, email, webhook]
        config: {}
        has_secrets:
          type: boolean
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateNotificationChannel:
      type: object
      required: [name, channel_type]
      properties:
        name:
          type: string
        channel_type:
          type: string
          enum: [discord, slack, email, webhook]
        config: {}
        secrets:
          type: object
          properties:
            webhook_url:
              type: string
            smtp_password:
              type: string
            headers:
              type: object
              additionalProperties:
                type: string
        enabled:
          type: boolean

    PatchNotificationChannel:
      type: object
      properties:
        name:
          type: string
        config: {}
        secrets:
          type: object
          properties:
            webhook_url:
              type: string
            smtp_password:
              type: string
            headers:
              type: object
              additionalProperties:
                type: string
        enabled:
          type: boolean

    NotificationRule:
      type: object
      required: [id, name, enabled, min_severity, triggers, channel_ids, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        min_severity:
          type: string
        triggers:
          type: array
          items:
            type: string
        channel_ids:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateNotificationRule:
      type: object
      required: [name]
      properties:
        name:
          type: string
        enabled:
          type: boolean
        min_severity:
          type: string
        triggers:
          type: array
          items:
            type: string
        channel_ids:
          type: array
          items:
            type: string
            format: uuid

    PatchNotificationRule:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        min_severity:
          type: string
        triggers:
          type: array
          items:
            type: string
        channel_ids:
          type: array
          items:
            type: string
            format: uuid

    DashboardStats:
      type: object
      required: [servers_total, agents_active, events_last_24h, alerts_open, alerts_by_status, alerts_by_severity, events_by_severity_24h]
      properties:
        servers_total:
          type: integer
        agents_active:
          type: integer
        events_last_24h:
          type: integer
        alerts_open:
          type: integer
        alerts_by_status:
          type: object
          additionalProperties:
            type: integer
        alerts_by_severity:
          type: object
          additionalProperties:
            type: integer
        events_by_severity_24h:
          type: object
          additionalProperties:
            type: integer

    Plugin:
      type: object
      required: [id, slug, name, version, kind, api_version, checksum_sha256, has_signature, source_path, load_status, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        kind:
          type: string
        api_version:
          type: integer
        checksum_sha256:
          type: string
        has_signature:
          type: boolean
        source_path:
          type: string
        load_status:
          type: string
        load_error:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PluginSupportStatus:
      type: object
      properties:
        Kind:
          type: string
        Runtime:
          type: string
          description: "`loaded` or `interface_only`"
        Notes:
          type: string

    PluginConfig:
      type: object
      required: [key, value, updated_at]
      properties:
        key:
          type: string
        value: {}
        updated_at:
          type: string
          format: date-time
