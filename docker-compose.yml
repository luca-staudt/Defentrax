# Defentrax — production-oriented local stack
# Usage (from repo root):
#   cp .env.example .env   # fill secrets (see comments)
#   docker compose up -d --build
#
# Optional profiles:
#   --profile agent   include host agent (enroll once via panel one-shot; credentials in volume)
#   --profile proxy   include Caddy reverse proxy on :80
#
# Image tags: pin immutable versions/digests in production — do not use :latest.

name: sentinel

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sentinel

  redis:
    image: redis:7.4.2-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - sentinel

  migrate:
    build:
      context: .
      dockerfile: sentinel/database/Dockerfile
    image: sentinel-migrate:${SENTINEL_IMAGE_TAG:-0.3.0}
    container_name: sentinel-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sentinel

  sentinel-api:
    build:
      context: .
      dockerfile: sentinel/api/Dockerfile
    image: sentinel-api:${SENTINEL_IMAGE_TAG:-0.3.0}
    container_name: sentinel-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SENTINEL_RULES_PATH: /opt/sentinel/rules
      SENTINEL_PLUGIN_DIR: /opt/sentinel/plugins/examples
      SENTINEL_BOOTSTRAP_ADMIN_EMAIL: ${SENTINEL_BOOTSTRAP_ADMIN_EMAIL:-}
      SENTINEL_BOOTSTRAP_ADMIN_PASSWORD: ${SENTINEL_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sentinel

  # Frontend: Next rewrites bake API_PROXY_TARGET at image build (not only runtime).
  # Must be the Compose service hostname — 127.0.0.1 inside the container ≠ the API.
  sentinel-frontend:
    build:
      context: ./sentinel/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://sentinel-api:8080}
    image: sentinel-frontend:${SENTINEL_IMAGE_TAG:-0.3.0}
    container_name: sentinel-frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://sentinel-api:8080}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://sentinel-api:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      sentinel-api:
        condition: service_healthy
    networks:
      - sentinel

  # Optional: compose stack agent. Do NOT put enrollment tokens in .env.
  # Panel flow (server detail → Issue enrollment token):
  #   docker compose --profile agent run --rm \
  #     -e SENTINEL_ENROLLMENT_TOKEN=senr_… -e SENTINEL_ENROLL_ONLY=1 sentinel-agent
  #   docker compose --profile agent up -d
  # Credentials persist in the agent_data volume; ongoing runs need only SENTINEL_API_URL.
  # Mount a host auth log via override, e.g.:
  #   volumes: ["./auth.log:/var/log/auth.log:ro"]
  sentinel-agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: sentinel/agent/Dockerfile
    image: sentinel-agent:${SENTINEL_IMAGE_TAG:-0.3.0}
    container_name: sentinel-agent
    restart: unless-stopped
    environment:
      SENTINEL_API_URL: http://sentinel-api:8080
      SENTINEL_AGENT_NAME: ${SENTINEL_AGENT_NAME:-compose-agent}
      SENTINEL_AGENT_CREDENTIAL_PATH: /var/lib/sentinel/credentials.json
      SENTINEL_AUTH_LOG_PATH: ${SENTINEL_AUTH_LOG_PATH:-/var/log/auth.log}
      SENTINEL_DOCKER_ENABLED: ${SENTINEL_DOCKER_ENABLED:-false}
    volumes:
      - agent_data:/var/lib/sentinel
    depends_on:
      sentinel-api:
        condition: service_healthy
    networks:
      - sentinel

  # Optional reverse proxy (http://localhost → frontend, /api → API, WS upgrade).
  reverse-proxy:
    profiles: ["proxy"]
    image: caddy:2.9.1-alpine
    container_name: sentinel-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HOST_PORT:-80}:80"
    volumes:
      - ./sentinel/deployments/docker-compose/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      sentinel-frontend:
        condition: service_started
      sentinel-api:
        condition: service_healthy
    networks:
      - sentinel

volumes:
  postgres_data:
    name: sentinel-postgres-data
  redis_data:
    name: sentinel-redis-data
  agent_data:
    name: sentinel-agent-data

networks:
  sentinel:
    name: sentinel-net
