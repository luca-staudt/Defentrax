# Reusable security scans. No repository secrets required.
# Tools: gitleaks, govulncheck, gosec (MEDIUM+), Trivy filesystem.
# Image scans run in reusable-docker.yml after build.
name: Reusable — Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks (secret scan)
        run: |
          set -euo pipefail
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            sentinel/api/go.sum
            sentinel/agent/go.sum
            sentinel/database/go.sum
            sentinel/detection/go.sum
            sentinel/plugins/go.sum
            sentinel/pkg/event/go.sum

      - name: Install govulncheck + gosec
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.1

      - name: govulncheck
        run: |
          set -euo pipefail
          for mod in api agent database detection plugins pkg/event; do
            echo "==> govulncheck sentinel/${mod}"
            (cd "sentinel/${mod}" && govulncheck ./...)
          done

      # Phase 19: fail on MEDIUM and HIGH (LOW still informational).
      - name: gosec MEDIUM+ (api, agent, database, detection, plugins)
        run: |
          set -euo pipefail
          for mod in api agent database detection plugins; do
            echo "==> gosec -severity=medium sentinel/${mod}"
            (cd "sentinel/${mod}" && gosec -quiet -severity=medium ./...)
          done

      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"
          ignore-unfixed: true
          format: table
          scanners: vuln,misconfig,secret
