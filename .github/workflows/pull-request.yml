# Pull Request CI — format, lint, unit, integration, security, build, containers.
# No repository secrets. Maps to root Makefile targets (see sentinel/docs/ci.md).
name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"

      - name: gofmt check (make fmt-check)
        run: make fmt-check

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            sentinel/api/go.sum
            sentinel/agent/go.sum
            sentinel/database/go.sum
            sentinel/detection/go.sum
            sentinel/plugins/go.sum
            sentinel/pkg/event/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: sentinel/api
          args: ./...
          install-mode: goinstall

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sentinel/frontend/package-lock.json

      - name: Frontend lint (npm run lint)
        working-directory: sentinel/frontend
        run: |
          npm ci
          npm run lint

      - name: OpenAPI validate (make openapi-validate)
        run: make openapi-validate

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            sentinel/api/go.sum
            sentinel/agent/go.sum
            sentinel/database/go.sum
            sentinel/detection/go.sum
            sentinel/plugins/go.sum
            sentinel/pkg/event/go.sum

      - name: Unit suite (make test)
        run: make test

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: sentinel_test
          POSTGRES_PASSWORD: sentinel_test
          POSTGRES_DB: sentinel_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel_test -d sentinel_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sentinel_test:sentinel_test@localhost:5432/sentinel_migration_test?sslmode=disable
      DATABASE_URL: postgres://sentinel_test:sentinel_test@localhost:5432/sentinel_migration_test?sslmode=disable
      REQUIRE_INTEGRATION_DB: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            sentinel/api/go.sum
            sentinel/agent/go.sum
            sentinel/database/go.sum
            sentinel/detection/go.sum
            sentinel/plugins/go.sum
            sentinel/pkg/event/go.sum

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Integration suite (scripts/run-integration-tests.sh)
        run: ./sentinel/scripts/run-integration-tests.sh

  security:
    name: Security scan
    uses: ./.github/workflows/reusable-security.yml
    permissions:
      contents: read

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            sentinel/api/go.sum
            sentinel/agent/go.sum
            sentinel/database/go.sum
            sentinel/detection/go.sum
            sentinel/plugins/go.sum
            sentinel/pkg/event/go.sum

      - name: Go build (make build)
        run: make build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sentinel/frontend/package-lock.json

      - name: Frontend production build
        working-directory: sentinel/frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_WS_URL: ws://localhost:8080
        run: |
          npm ci
          npx next build

  container-build:
    name: Container build
    uses: ./.github/workflows/reusable-docker.yml
    with:
      images: api
      tag: pr
      scan-api-image: true
    permissions:
      contents: read
