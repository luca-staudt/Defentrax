# Development overrides — bind-mounts, exposed DB/Redis, looser defaults.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Prefer APP_ENV=development and COOKIE_SECURE=false in .env for local HTTP.

services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  defentrax-api:
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      # Live-edit bundled detection rules without rebuilding the API image.
      - ./sentinel/rules:/opt/sentinel/rules:ro

  defentrax-frontend:
    build:
      context: ./sentinel/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://defentrax-api:8080}
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://defentrax-api:8080}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://defentrax-api:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
